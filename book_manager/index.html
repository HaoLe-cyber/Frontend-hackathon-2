<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Danh Mục Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light">

    <header>
        <h1 class="font-weight-bold">Quản Lý Danh Mục Sách</h1>
    </header>

    <!-- FORM -->
    <div class="container-custom">
        <form id="book-form" onsubmit="addBook(event)">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Tên sách:</label>
                <div class="col-sm-10">
                    <input type="text" id="name" class="form-control" />
                    <div class="form-text text-danger mt-1 error-message" id="error-name">Không được bỏ trống</div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Tác giả:</label>
                <div class="col-sm-10">
                    <input type="text" id="author" class="form-control" />
                    <div class="form-text text-danger mt-1 error-message" id="error-author">Không được bỏ trống</div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Năm xuất bản:</label>
                <div class="col-sm-10">
                    <input type="text" id="releaseDate" class="form-control" />
                    <div class="form-text text-danger mt-1 error-message" id="error-releaseDate">Không được bỏ trống
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <label class="col-sm-2 col-form-label">Thể loại:</label>
                <div class="col-sm-10">
                    <input type="text" id="category" class="form-control" />
                    <div class="form-text text-danger mt-1 error-message" id="error-category">Không được bỏ trống</div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Thêm sách</button>
            </div>
        </form>

        <!-- Search -->
        <div class="my-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo tên sách..." />
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-bordered text-center align-middle">
                <thead class="table-light fw-bold">
                    <tr>
                        <th scope="col">Tên sách</th>
                        <th scope="col">Tác giả</th>
                        <th scope="col">Năm</th>
                        <th scope="col">Thể loại</th>
                        <th scope="col">Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
